    <div class="container-fluid px-4 px-md-5 mt-4">
    <div class="row align-items-start">
    <div class="col-7">  
                
     <div class="bg-light text-center mb-3 w-100 p-1">
       <h5 class="mb-0">OBMC Student Enrollment Form</h5>
      </div>
     <div class="col-5">
      <div class="card mx-auto shadow-sm" style="width: 399%;">
       <div class="card-body p-2">
     <h5 class="text-center mb-3">
       Student Information
          </h5>
     <form>
    <div class="mb-2">
    <label class="form-label small mb-1">
     First Name
    </label>
    <input type="text"  class="form-control form-control-sm" placeholder="Enter your first name">
    </div>
     <div class="mb-2">
    <label class="form-label small mb-1">
     Last Name
    </label>
    <input type="text"  class="form-control form-control-sm" placeholder="Enter your last name">
    </div>
     <div class="mb-2">
     <label class="form-label small mb-1">
      Birth Date
    </label>
   <input type="text" class="form-control form-control-sm" placeholder="mm/dd/yyyy">
     </div>
   <div class="mb-2">
      <label class="form-label small mb-1">
       Gender
         </label>
     <input type="text"
   class="form-control form-control-sm"
   placeholder="Enter your gender">
      </div>
      <div class="mb-2">
    <label class="form-label small mb-1">
      Grade level
      </label>
    <input type="text" class="form-control form-control-sm" placeholder="Enter your Grade&Level">
    </div>
     <div class="card-body p-2">
     <h5 class="text-center mb-3">
     CONTACT DETAILS
      </h5>
     <div class="mb-2">
    <label class="form-label small mb-1">
     Email Address
     </label>
     <input type="email" class="form-control form-control-sm" placeholder="student@example.com">
    </div>
    <div class="mb-2">
    <label class="form-label small mb-1">
     Contact Number
     </label>

     <input type="text" class="form-control form-control-sm" placeholder="0123-456-1234">
    </div>
     <div class="mb-2">
     <label class="form-label small mb-1">
     Message
     </label>
     <textarea class="form-control form-control-sm" rows="4" placeholder="Type your message here"></textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-sm w-100">
    Submit Enrollment
    </button>
     </form>
